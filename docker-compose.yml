services:

  app:
    build: .

    ports:
      - "3001:3001"

    volumes:
      - .:/app

    depends_on:
      - postgres
      - redis

    environment:
      DB_HOST: postgres
      REDIS_HOST: redis

  postgres:
    image: postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: postgres

    ports:
      - "5432:5432"

  redis:
    image: redis

    ports:
      - "6379:6379"